apiVersion: v1
kind: ReplicationController
metadata:
  name: myrc
spec:
  replicas: 3
  template:
    metadata:
      labels:
        enc: prod
    spec:
      containers:
        - image: nginx
          name: mynginx
          ports:
            - containerPort: 80
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'touch /usr/share/nginx/html/hello.html'
            initialDelaySeconds: 5
            periodSeconds: 5
