apiVersion: apps/v1
kind: DaemonSet
metadata:
    name: myds
spec: 
   selector:
        matchLabels:
             app: myapp
   template:
        metadata:
            labels: 
             app: myapp
        spec:
            containers: 
             - image: nginx
               name: mynginx
               ports: 
                 - containerPort: 80
