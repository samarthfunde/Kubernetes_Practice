apiVersion: apps/v1
kind: Deployment
metadata:
   name: mydeploy
spec:
   replicas: 1
   selector:
      matchLabels:
         env: test
   template:
     metadata:
       labels:
         env: test
     spec:
        containers:
          - image: nginx
            name: mynginx
            ports:
              - containerPort: 80
            volumeMounts:
              - name: mynfsvolume
                mountPath: /usr/share/nginx/html
        volumes:
          - name: mynfsvolume
            persistentVolumeClaim:
              claimName: mypvc1
